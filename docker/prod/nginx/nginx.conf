# arkkala/docker/prod/nginx/nginx.conf
user nginx;
worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 50M;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/s;

    # Gzip Compression for Core Web Vitals & PageSpeed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/ld+json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        font/ttf
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    upstream django_server {
        server django:8000 fail_timeout=10s max_fails=3;
        keepalive 32;
    }

    upstream prerender_server {
        server prerender:3000 fail_timeout=10s max_fails=3;
        keepalive 16;
    }

    # ------------------------------------------------------------
    # 1. HTTP (Port 80) -> ACME Challenge & 301 Redirect to HTTPS
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name arkkala.com www.arkkala.com api.arkkala.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------
    # 2. Main Frontend & SEO/AEO/GEO Domain (arkkala.com)
    # ------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name arkkala.com www.arkkala.com;

        ssl_certificate /etc/letsencrypt/live/arkkala.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arkkala.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Canonical www -> non-www 301 Redirect (Prevents Duplicate Content)
        if ($host = 'www.arkkala.com') {
            return 301 https://arkkala.com$request_uri;
        }

        # Global Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Block hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # SEO, AEO & GEO Endpoints Proxied Directly to Django
        location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt|llms-full\.txt|healthz/)$ {
            proxy_pass http://django_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Backend API Requests from React Frontend (/api/...)
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://django_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Django Admin Panel
        location /admin/ {
            limit_req zone=admin_limit burst=10 nodelay;
            proxy_pass http://django_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Django Static Files (Supports both /static/ and /staticfiles/ in prod.py)
        location /staticfiles/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, no-transform, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, no-transform, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Django Media Files (Product Images, Videos, Brand/Category Logos)
        location /media/ {
            alias /app/mediafiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, no-transform" always;
            add_header Content-Disposition "inline" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # React Hashed Static Assets (/assets/...) - Long-Term Immutable Cache
        location ^~ /assets/ {
            root /usr/share/nginx/html/main;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, no-transform, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Main SPA Router + Prerender Dynamic Rendering for Search, Shopping & AI Bots
        location / {
            set $prerender 0;

            if ($http_user_agent ~* "googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|slackbot|vkShare|W3C_Validator|whatsapp|telegrambot|torob|emalls|snappbot|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|PerplexityBot|Google-Extended|Applebot-Extended|Meta-ExternalAgent|Bytespider|CCBot|Amazonbot|DuckAssistBot|bot|crawler|spider|slurp|ia_archiver") {
                set $prerender 1;
            }

            if ($args ~ "_escaped_fragment_") {
                set $prerender 1;
            }

            if ($http_user_agent ~ "Prerender") {
                set $prerender 0;
            }

            if ($uri ~* "\.(js|mjs|css|xml|less|png|jpg|jpeg|gif|webp|avif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot|wasm)$") {
                set $prerender 0;
            }

            if ($prerender = 1) {
                rewrite .* /$scheme://$host$request_uri? break;
                proxy_pass http://prerender_server;
            }

            root /usr/share/nginx/html/main;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Never cache index.html so new deployments reflect immediately
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        }
    }

    # ------------------------------------------------------------
    # 3. Dedicated API Subdomain (api.arkkala.com)
    # ------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.arkkala.com;

        ssl_certificate /etc/letsencrypt/live/arkkala.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arkkala.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://django_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /admin/ {
            limit_req zone=admin_limit burst=10 nodelay;
            proxy_pass http://django_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /staticfiles/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, no-transform, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, no-transform, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location /media/ {
            alias /app/mediafiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, no-transform" always;
            add_header Content-Disposition "inline" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
    }
}