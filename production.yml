name: arkkala_prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  django:
    build:
      context: .
      dockerfile: ./docker/prod/django/Dockerfile
    image: arkkala-django:${IMAGE_TAG:-latest}
    container_name: arkkala_prod_django
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=arkkala.settings.prod
      - PYTHONUNBUFFERED=1
    volumes:
      - static_prod_volume:/app/staticfiles
      - media_prod_volume:/app/mediafiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arkkala_internal
      - arkkala_public
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: arkkala_prod_postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/prod/postgres/backups:/backups
    networks:
      - arkkala_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: arkkala_prod_pgadmin
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_prod_data:/var/lib/pgadmin
      - ./docker/prod/pgadmin/servers.json:/pgadmin4/servers.json:ro
    entrypoint:
      - sh
      - -c
      - |
        /entrypoint.sh &
        PGADMIN_PID=$$!
        sleep 10
        /venv/bin/python /pgadmin4/setup.py load-servers /pgadmin4/servers.json --user "$${PGADMIN_DEFAULT_EMAIL}" --replace || true
        wait $$PGADMIN_PID
    networks:
      - arkkala_internal
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: arkkala_prod_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - arkkala_internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  celery_worker:
    build:
      context: .
      dockerfile: ./docker/prod/celery/Dockerfile
    image: arkkala-celery:${IMAGE_TAG:-latest}
    container_name: arkkala_prod_celery_worker
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - media_prod_volume:/app/mediafiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arkkala_internal
      - arkkala_public
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A arkkala inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  celery_beat:
    build:
      context: .
      dockerfile: ./docker/prod/celery/Dockerfile
    image: arkkala-celery:${IMAGE_TAG:-latest}
    container_name: arkkala_prod_celery_beat
    restart: unless-stopped
    env_file:
      - .env.prod
    command: /start_beat
    volumes:
      - celerybeat_prod_data:/app/celerybeat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arkkala_internal
      - arkkala_public
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    build:
      context: .
      dockerfile: ./docker/prod/nginx/Dockerfile
    container_name: arkkala_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/prod/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_prod_volume:/app/staticfiles:ro
      - media_prod_volume:/app/mediafiles:ro
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      django:
        condition: service_healthy
    networks:
      - arkkala_public
    logging: *default-logging

  certbot:
    image: certbot/certbot
    container_name: arkkala_prod_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done;'"
    restart: always

networks:
  arkkala_internal:
    driver: bridge
    internal: true
  arkkala_public:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  static_prod_volume:
  media_prod_volume:
  celerybeat_prod_data:
  pgadmin_prod_data: